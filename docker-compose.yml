name: dedplay-translate
services:
  ollama:
    image: ollama/ollama:latest
    container_name: dedplay-translate-ollama
    restart: unless-stopped
    volumes:
      - /DATA/AppData/dedplay-translate/ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_NUM_PARALLEL=1

  app:
    build: .
    image: berzahbey/dedplay-translate:latest
    container_name: dedplay-translate
    restart: unless-stopped
    depends_on:
      - ollama
    ports:
      - "8060:8000"
    volumes:
      - /DATA/AppData/dedplay-translate/data:/data
    environment:
      - OLLAMA_URL=http://ollama:11434
      - LLM_MODEL=gemma3:12b
      - LLM_CTX=4096
